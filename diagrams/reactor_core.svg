<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#f7f7f7"/>
  <!-- Reactor vessel -->
  <g transform="translate(150,60)">
    <rect x="0" y="0" width="500" height="380" rx="20" fill="#e6eef8" stroke="#2b6ea3" stroke-width="3"/>
    <!-- Core -->
    <circle cx="250" cy="190" r="110" fill="#ffd9b3" stroke="#b36b00" stroke-width="3"/>
    <!-- Fuel assemblies -->
    <g fill="#ffb366" stroke="#b36b00" stroke-width="1">
      <rect x="210" y="140" width="30" height="100"/>
      <rect x="250" y="140" width="30" height="100"/>
      <rect x="290" y="140" width="30" height="100"/>
    </g>
    <!-- Control rods -->
    <g fill="#cccccc" stroke="#666" stroke-width="1">
      <rect x="230" y="110" width="10" height="40"/>
      <rect x="270" y="110" width="10" height="40"/>
    </g>
    <!-- Coolant inlet/outlet -->
    <g stroke="#0066cc" stroke-width="2" fill="none">
      <path d="M -20 100 L 0 100"/>
      <path d="M 500 100 L 520 100"/>
      <text x="-18" y="95" font-size="12" fill="#0066cc">inlet</text>
      <text x="522" y="95" font-size="12" fill="#0066cc">outlet</text>
    </g>
    <!-- Labels -->
    <text x="250" y="320" font-size="16" text-anchor="middle" fill="#333">Reaktör Çekirdeği (örnek şema)</text>
  </g>
</svg>